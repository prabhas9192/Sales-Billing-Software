[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "billflow"
version = "6.0.0"
description = "Sales, billing and inventory for a shop: runs on a laptop, used from phones, on SQLite, PostgreSQL, MySQL or MariaDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prabhas" }
]
keywords = ["pos", "billing", "retail", "inventory", "sales", "gst", "sqlite", "postgresql", "mysql", "mariadb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "tzdata; sys_platform == 'win32'",  # Windows has no time zone database of its own
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
desktop = ["PySide6>=6.5.0"]

[project.scripts]
billflow = "billflow.launcher:main"

[tool.setuptools.packages.find]
include = ["billflow*"]

[tool.setuptools.package-data]
"billflow.web" = ["static/*"]
